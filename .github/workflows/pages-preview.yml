name: Deploy pull request preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: pull-request-preview
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build preview
        if: github.event.action != 'closed'
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}
        run: pnpm run build

      - name: Publish preview
        if: github.event.action != 'closed'
        env:
          DEPLOY_MODE: preview
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-pages.sh

      - name: Remove closed preview
        if: github.event.action == 'closed'
        env:
          DEPLOY_MODE: cleanup
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-pages.sh
