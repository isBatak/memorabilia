name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: deploy-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'github-pages' || 'pull-request-preview' }}
      url: ${{ github.event_name == 'push' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || format('https://{0}.github.io/{1}/previews/pr-{2}/', github.repository_owner, github.event.repository.name, github.event.pull_request.number) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.sha || github.event.repository.default_branch }}

      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build site
        if: github.event.action != 'closed'
        env:
          PAGES_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/previews/pr-{1}', github.event.repository.name, github.event.pull_request.number) || '' }}
        run: pnpm run build

      - name: Publish site
        env:
          DEPLOY_MODE: ${{ github.event_name == 'push' && 'production' || github.event.action == 'closed' && 'cleanup' || 'preview' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-pages.sh
