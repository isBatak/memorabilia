 godinama upoznavao sa epizodama ove serije i po zadnjim podacima gledanost od samog početka pa sve do danas gotovo da i nije pala. Na našoj televiziji Pingu se pojavio početkom devedesetih, kada smo njegove doživljaje mogli pratiti prije večernjeg Dnevnika. Ovaj švicarski crtić primjeren je za sve generacije, kao i narodnosti, jer likovi ne govore već samo mrmljanjem i životinjskim pokretima prate priču, koju tako svatko može na svoj način interpretirati. Uspjeh serije se naravno osjetio i na ostalim područjima, ponajviše marketingu. U Švicarskoj je Pingu dobio važnog partnera - poduzeće Migros koje uvozi i izvozi prehranbene namirnice. Tako se je naš pingvin našao i na policama supermarketa diljem svijeta. Priča se i da bi se uskoro lik pingvina mogao pojaviti i na priznatim švicarskim satovima i sirevima. Postoje također razne igre, knjige i audio kazete na kojima se smjestio mali Pingu. Prošle godine poduzeće HIT Entertaiment odkupilo je prava za izdavanje svih epizoda na DVD-u u Velikoj Britaniji. U planu su i 52 nove epizode, koje su se navodno počele stvarati krajem 2005 godine.\n\nO ČEMU SE RADI?\nGlavna osoba u crtiću je simpatičan pingvin Pingu koji živi sa svojom obitelji negdje na južnom polu. Tako kroz epizode pratimo doživljaje maloga pingvina kao i ostalih članova njegove obitelji. Pingu najviše voli jesti ribe, igrati se sa najboljim prijateljem Robbyjem, sanjkati se, slušati glazbu. Pinga je Pingueva mlađa sestra. Ona se voli igrati sa plišanim igračkama, skijati se i provoditi vrijeme sa majkom. Tu je i Pinguev otac, po zaposlenju poštar. On voli u miru čitati novine sjedeći u svom naslonjaču, te raznositi poštu svojim motornim sanjkama. Rado pomaže i Pinguevoj mami u kućanskim poslovima, kao npr. usisavanju i peglanju. Pingueva mama, kao i svaka mama, najviše voli svoju djecu, te kuhanje. Robby je tuljan, Pinguev najbolji prijatelj, voli vodu i ribe, te igranje loptom. \n\nEDIT: Chrysler je našao i linkove gdje se mogu downloadati epizode. Hvala p d\" target=\"_blank\"\u003eOpening scene\u003c/a\u003e\u003cbr\u003e\u003cbr\u003e\n\u003cbr\u003e\nUspješan animator Othmar Gutman želio je zabaviti djecu pričama, ali s nekakvim novim pristupom. \u003cimg src=\"http://img335.imageshack.us/img335/7848/pingu19ip.jpg\" border=\"0\" align=\"right\"\u003e Tako je uskoro nastala priča o pingvinu po imenu Pingu, kojeg je Gutman upotrijebio kako bi najmlađe upoznao sa svakidašnjim problemima djece njihovih dobi. Seriju su ubrzo zavoljeli i oni stariji, kao i roditelji, jer se svatko tko ju je gledao nekako mogao identicifirati sa simpatičnim pingvinom ili nekim njegovim prijateljem. \u003cimg src=\"http://img124.imageshack.us/img124/4461/pingu29da.jpg\" border=\"0\" align=\"left\"\u003e Od 1986. godine snimljeno je 104 epizoda, koje je režirao i animirao Othmar Gutman, prvotno samo za švicarsku televiziju. No ubrzo je uspjeh crtića postao internacionalan, jednostavne priče i animacija očarale su mnoge susjedne zemlje, a kasnije i cijelu Europu i SAD. Čak i u Japanu Pingu ima veliku skupinu obožavatelja, navodno je čak 90% učenika u japanskim srednjim školama upoznato sa njegovim likom. \u003cimg src=\"http://img448.imageshack.us/img448/4045/pingu37vs.jpg\" border=\"0\" align=\"right\"\u003e BBC je britance godinama upoznavao sa epizodama ove serije i po zadnjim podacima gledanost od samog početka pa sve do danas gotovo da i nije pala. Na našoj televiziji Pingu se pojavio početkom devedesetih, kada smo njegove doživljaje mogli pratiti prije večernjeg Dnevnika. \u003cimg src=\"http://img448.imageshack.us/img448/6161/pingu40fc.jpg\" border=\"0\" align=\"left\"\u003e Ovaj švicarski crtić primjeren je za sve generacije, kao i narodnosti, jer likovi ne govore već samo mrmljanjem i životinjskim pokretima prate priču, koju tako svatko može na svoj način interpretirati. Uspjeh serije se naravno osjetio i na ostalim područjima, ponajviše marketingu. \u003cimg src=\"http://img448.imageshack.us/img448/4872/pingu54oj.jpg\" border=\"0\" align=\"right\"\u003e U Švicarskoj je Pingu dobio važnog partnera - poduzeće \u003ci\u003eMigros\u003c/i\u003e koje uvozi i izvozi prehranbene namirnice. Tako se je naš pingvin našao i na policama supermarketa diljem svijeta. Priča se i da bi se uskoro lik pingvina mogao pojaviti i na priznatim švicarskim satovima i sirevima. Postoje također razne igre, knjige i audio kazete na kojima se smjestio mali Pingu. Prošle godine poduzeće \u003ci\u003eHIT Entertaiment\u003c/i\u003e odkupilo je prava za izdavanje svih epizoda na DVD-u u Velikoj Britaniji. U planu su i 52 nove epizode, koje su se navodno počele stvarati krajem 2005 godine.\u003cbr\u003e\n\u003cbr\u003e\n\u003cb\u003eO ČEMU SE RADI?\u003c/b\u003e\u003cbr\u003e\nGlavna osoba u crtiću je simpatičan pingvin \u003cb\u003ePingu\u003c/b\u003e koji živi sa svojom obitelji negdje na južnom polu. \u003cimg src=\"http://img448.imageshack.us/img448/2379/pingu65eh.jpg\" border=\"0\" align=\"left\"\u003e Tako kroz epizode pratimo doživljaje maloga pingvina kao i ostalih članova njegove obitelji. Pingu najviše voli jesti ribe, igrati se sa najboljim prijateljem Robbyjem, sanjkati se, slušati glazbu. \u003cb\u003ePinga\u003c/b\u003e je Pingueva mlađa sestra. Ona se voli igrati sa plišanim igračkama, skijati se i provoditi vrijeme sa majkom. \u003cimg src=\"http://img448.imageshack.us/img448/4463/pingu74nq.jpg\" border=\"0\" align=\"right\"\u003e Tu je i \u003cb\u003ePinguev otac\u003c/b\u003e, po zaposlenju poštar. On voli u miru čitati novine sjedeći u svom naslonjaču, te raznositi poštu svojim motornim sanjkama. Rado pomaže i Pinguevoj mami u kućanskim poslovima, kao npr. usisavanju i peglanju. \u003cb\u003ePingueva mama\u003c/b\u003e, kao i svaka mama, najviše voli svoju djecu, te kuhanje. \u003cb\u003eRobby\u003c/b\u003e je tuljan, Pinguev najbolji prijatelj, voli vodu i ribe, te igranje loptom. \u003cbr\u003e\n\u003cbr\u003e\n\u003cb\u003eEDIT:\u003c/b\u003e \u003ca href=\"mailto:chrysler@net.hr\"\u003eChrysler\u003c/
